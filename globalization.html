<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
<script>
(async function () {
  // 1) Render travel list
  await renderList("/data/travel.json", "#list", "#item");

  // 2) Fetch again for map (cheap — cached by browser)
  const data = await fetch("/data/travel.json").then(r => r.json());
  const visited = {};
  for (const it of data.items) if (it.country_code) visited[it.country_code] = 1;
  const visitedSet = new Set(Object.keys(visited));

  // 3) Read accent color from CSS so dark-mode follows
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#0a7a6b";
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--border").trim() || "#e5e5e5";

  // 4) Init map
  if (typeof jsVectorMap !== "undefined") {
    const map = new jsVectorMap({
      selector: "#world-map",
      map: "world",
      backgroundColor: "transparent",
      zoomButtons: true,
      zoomOnScroll: true,
      zoomAnimate: true,
      regionStyle: {
        initial: { fill: muted, stroke: "none", fillOpacity: 1 },
        hover:   { fillOpacity: 0.85, cursor: "pointer" }
      },
      series: {
        regions: [{
          attribute: "fill",
          values: Object.fromEntries(Object.keys(visited).map(k => [k, accent])),
          legend: false
        }]
      },
      onRegionTooltipShow(_event, tooltip, code) {
        if (visitedSet.has(code)) tooltip.text(tooltip.text() + " · Visited");
      },
      onRegionClick(_event, code) {
        const el = document.getElementById(code);
        if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); el.animate([{backgroundColor:accent+"22"},{backgroundColor:"transparent"}],{duration:1200}); }
      }
    });
    // Keep map sized correctly on viewport changes
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => map.updateSize && map.updateSize(), 150);
    });
  } else {
    document.getElementById("world-map").innerHTML = '<p class="loading" style="text-align:center;padding:2rem">Map failed to load (CDN blocked?). Entries are listed below.</p>';
  }
})();
</script>
